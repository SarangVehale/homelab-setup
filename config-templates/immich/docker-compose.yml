# Immich - self-hosted photo/video management.
# Machine-learning service deliberately omitted: face recognition and CLIP smart
# search are the heaviest part of this stack, and this is old Haswell hardware
# with no HEVC hardware transcode support - already a known constraint (see
# docs/known-issues-and-decisions.md). Running as a straightforward photo
# backup/timeline/album tool instead.
#
# The published port is bound explicitly to the Tailscale IP (not 0.0.0.0),
# same enforcement approach used for Audiobookshelf/Calibre-Web - a real bind,
# not an app-level setting that could be silently ignored.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - __TAILSCALE_IP__:2283:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    user: "${IMMICH_UID}:${IMMICH_GID}"

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
