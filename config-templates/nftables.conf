#!/usr/bin/nft -f
# Restrict Jellyfin (8096) and AdGuard Home admin UI (80) to Tailscale only.
# AdGuard DNS (53) additionally allowed from the LAN subnet.
#
# Matches by Tailscale's IP range (100.64.0.0/10, the CGNAT block Tailscale
# always uses) rather than the "tailscale0" interface name. Interface-name
# matching requires the interface to already exist at ruleset-load time -
# at boot, nftables.service starts before tailscaled has connected, so
# referencing "tailscale0" by name caused the WHOLE ruleset (including this
# rule and Jellyfin's) to fail validation and never load at all. IP-range
# matching has no such dependency and works correctly regardless of boot
# ordering.
#
# NOTE: if the LAN subnet or Tailscale range differs on new hardware, update
# 192.168.1.0/24 below. 100.64.0.0/10 is Tailscale's fixed CGNAT block and
# does not need to change.

destroy table inet jellyfin_restrict
destroy table inet adguard_restrict

table inet jellyfin_restrict {
  chain input {
    type filter hook input priority filter; policy accept;
    tcp dport 8096 ip saddr 100.64.0.0/10 accept
    tcp dport 8096 iif "lo" accept
    tcp dport 8096 drop comment "jellyfin: tailscale-only"
  }
}

table inet adguard_restrict {
  chain input {
    type filter hook input priority filter; policy accept;

    # DNS: allow from LAN subnet or Tailscale range, drop everything else
    tcp dport 53 ip saddr 192.168.1.0/24 accept
    udp dport 53 ip saddr 192.168.1.0/24 accept
    tcp dport 53 ip saddr 100.64.0.0/10 accept
    udp dport 53 ip saddr 100.64.0.0/10 accept
    tcp dport 53 iif "lo" accept
    udp dport 53 iif "lo" accept
    tcp dport 53 drop comment "adguard dns: lan+tailscale only"
    udp dport 53 drop comment "adguard dns: lan+tailscale only"

    # Web admin UI: tailscale only
    tcp dport 80 ip saddr 100.64.0.0/10 accept
    tcp dport 80 iif "lo" accept
    tcp dport 80 drop comment "adguard webui: tailscale-only"
  }
}
