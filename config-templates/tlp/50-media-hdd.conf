# Exclude the media HDD's USB-SATA bridge (JMicron JMS583, 152d:0583) from TLP's
# USB autosuspend management. TLP's own udev rule (85-tlp.rules) was re-asserting
# USB_AUTOSUSPEND policy on every connect event, overriding the power/control=on
# fix from /etc/udev/rules.d/99-media-hdd.rules within moments of it being applied
# on reconnect - this is what let the drive keep losing the autosuspend-disable fix.
USB_DENYLIST="152d:0583"
