<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sarang-hp — services</title>
<style>
  :root {
    --bg: #14161d;
    --card: #1c1f28;
    --border: #2a2e3a;
    --text: #e8e9ed;
    --sub: #9aa0ac;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 {
    text-align: center;
    font-weight: 600;
    font-size: 22px;
    color: var(--sub);
    letter-spacing: 0.02em;
    margin: 0 0 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .icon { font-size: 26px; margin-bottom: 10px; display: block; }
  .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .desc { font-size: 13px; color: var(--sub); }
  .port { font-size: 12px; color: var(--sub); font-family: ui-monospace, monospace; margin-top: 8px; opacity: 0.7; }
</style>
</head>
<body>
  <h1>Reachable only over Tailscale</h1>
  <div class="grid">
    <a class="card" href="http://100.100.208.10:8096" target="_blank">
      <span class="icon">🎬</span>
      <div class="name">Jellyfin</div>
      <div class="desc">Movies &amp; TV</div>
      <div class="port">:8096</div>
    </a>
    <a class="card" href="http://100.100.208.10:3333" target="_blank">
      <span class="icon">🎧</span>
      <div class="name">Audiobookshelf</div>
      <div class="desc">Audiobooks</div>
      <div class="port">:3333</div>
    </a>
    <a class="card" href="http://100.100.208.10:8083" target="_blank">
      <span class="icon">📚</span>
      <div class="name">Calibre-Web</div>
      <div class="desc">Ebooks</div>
      <div class="port">:8083</div>
    </a>
    <a class="card" href="http://100.100.208.10:8080" target="_blank">
      <span class="icon">⬇️</span>
      <div class="name">qBittorrent</div>
      <div class="desc">Downloads</div>
      <div class="port">:8080</div>
    </a>
  </div>
</body>
</html>
