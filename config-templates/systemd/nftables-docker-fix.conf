[Service]
# --no-block is essential: it queues the job and returns immediately, so
# nftables.service is never held open waiting on Docker. The leading "-"
# additionally means a failure here cannot fail nftables itself.
#
# Do NOT call the script directly from ExecStartPost. That blocks
# nftables.service - which runs very early in boot - until Docker responds,
# and hung boot for 18+ minutes with no diagnostic when it could not.
ExecStartPost=-/usr/bin/systemctl start --no-block docker-network-fix.service

# Belt and braces: bound nftables itself too.
TimeoutStartSec=30
