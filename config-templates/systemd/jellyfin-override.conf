[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/jellyfin /etc/jellyfin /var/cache/jellyfin /var/log/jellyfin

# Default is on-failure, which does not cover a clean-exit-but-wrong state.
# The health check restarts a hung Jellyfin anyway, but this handles the
# simpler cases faster and without waiting for the 5-minute timer.
Restart=always
RestartSec=10
