[Unit]
# Bound the restart loop. Without these, Restart=always turns a service
# failing on a persistent condition (a full disk making SQLite throw
# "disk I/O error", for example) into an endless crash loop that writes a
# core dump every RestartSec and accelerates the very problem causing it.
# After 5 failures in 10 minutes, stop and stay failed so the health check
# and a human can see it.
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/jellyfin /etc/jellyfin /var/cache/jellyfin /var/log/jellyfin

Restart=always
RestartSec=15
