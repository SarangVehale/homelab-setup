[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
# The "-" prefix is essential on any path that lives on removable storage.
# Without it, ProtectSystem=strict fails to set up its mount namespace when
# the external HDD is absent and the service cannot start at all:
#   Failed to set up mount namespacing: .../Media/ebooks: No such file or directory
#   status=226/NAMESPACE
ReadWritePaths=/opt/calibre-web -__HOME__/Media/ebooks

Restart=always
RestartSec=15
